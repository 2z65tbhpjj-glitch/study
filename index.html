<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Study Math, Science, History, and all your subjects here!</title>
<style>
  :root {
    color-scheme: dark;
    --red: #ff294c;
    --background: #08080b;
    --text: #f5f1f3;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    -webkit-user-select: none;
    user-select: none;
  }

  ::selection { background: transparent; color: inherit; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--background);
    color: var(--text);
    font-family: Arial, sans-serif;
    overscroll-behavior: none;
  }

  body {
    min-height: 100dvh;
    padding: 48px 20px;
    background:
      radial-gradient(ellipse at 50% 0, #ff294c15, transparent 65%),
      var(--background);
  }

  body.loading, body.activity-open { overflow: hidden; }

  button { font: inherit; }

  button:focus-visible, canvas:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 4px;
  }

  main {
    max-width: 1100px;
    margin: auto;
    opacity: 0;
    transform: translateY(18px);
    transition: opacity 650ms ease, transform 650ms ease;
  }

  body.ready main { opacity: 1; transform: translateY(0); }

  .accent {
    width: 48px;
    height: 4px;
    margin: 0 auto 22px;
    border-radius: 10px;
    background: var(--red);
    box-shadow: 0 0 24px #ff294c65;
  }

  h1 {
    margin: 0 0 36px;
    text-align: center;
    font-size: clamp(1.7rem, 5vw, 3rem);
    line-height: 1.3;
    letter-spacing: -.04em;
    overflow-wrap: anywhere;
  }

  .subject-grid {
    display: grid;
    grid-template-columns: repeat(10, minmax(0, 1fr));
    gap: 12px;
  }

  .subject-button {
    position: relative;
    width: 100%;
    min-width: 0;
    aspect-ratio: 1;
    padding: 0;
    overflow: hidden;
    border: 1px solid #292129;
    border-radius: 16px;
    background: linear-gradient(145deg, #19151a, #101013);
    cursor: pointer;
    box-shadow: 0 8px 20px #00000030;
    transition: transform 160ms, border-color 160ms, box-shadow 160ms;
  }

  .subject-button:hover {
    border-color: var(--red);
    transform: translateY(-3px);
    box-shadow: 0 8px 25px #ff294c25;
  }

  .subject-button:active { transform: scale(.96); }

  .subject-image {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
  }

  #loading-screen {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at center, #3a101d 0, #0b080d 45%, #08080b 75%);
    opacity: 1;
    transition: opacity 650ms ease, visibility 650ms ease;
  }

  #loading-screen.finished {
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
  }

  .loading-content { width: min(900px, 100%); text-align: center; }

  .loading-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: clamp(18px, 4vw, 48px);
  }

  .loading-title {
    margin: 0;
    max-width: 500px;
    font-size: clamp(1.5rem, 4vw, 3rem);
    font-weight: 800;
    line-height: 1.25;
    letter-spacing: -.04em;
    text-shadow: 0 0 35px #ff294c40;
  }

  .loading-image {
    width: clamp(60px, 12vw, 130px);
    aspect-ratio: 1;
    flex-shrink: 0;
    object-fit: cover;
    border: 2px solid #ff294c70;
    border-radius: 22%;
    box-shadow: 0 0 35px #ff294c30;
    animation: full-rotation 1.6s linear infinite;
  }

  .loading-track {
    width: min(280px, 75%);
    height: 4px;
    margin: 38px auto 0;
    overflow: hidden;
    border-radius: 10px;
    background: #ffffff0d;
  }

  .loading-fill {
    height: 100%;
    width: 40%;
    border-radius: inherit;
    background: var(--red);
    box-shadow: 0 0 15px var(--red);
    animation: loading-progress 1.1s ease-in-out infinite;
  }

  @keyframes full-rotation {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes loading-progress {
    from { transform: translateX(-110%); }
    to { transform: translateX(360%); }
  }

  #geometry-panel {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-width: none;
    max-height: none;
    margin: 0;
    padding: 0;
    border: 0;
    background: #070709;
    color: var(--text);
    overflow: hidden;
  }

  #geometry-panel[open] { display: flex; flex-direction: column; }
  #geometry-panel::backdrop { background: #070709; }
  #geometry-panel:fullscreen { width: 100%; height: 100%; }

  .toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    padding:
      max(14px, env(safe-area-inset-top))
      max(18px, env(safe-area-inset-right))
      14px
      max(18px, env(safe-area-inset-left));
    border-bottom: 1px solid #ff294c25;
    background: #0c0b0e;
    flex-shrink: 0;
  }

  .title-group { display: flex; align-items: center; gap: 12px; }

  .indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 16px #ff294c80;
  }

  h2 { margin: 0; font-size: 17px; }

  .close-button {
    display: grid;
    place-items: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border: 1px solid #ff294c40;
    border-radius: 12px;
    background: #ff294c0d;
    color: var(--red);
    font: 32px/1 Arial, sans-serif;
    cursor: pointer;
  }

  .close-button:hover { background: #ff294c25; }

  .surface-area {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    touch-action: none;
    cursor: crosshair;
    outline-offset: -3px !important;
  }

  .instructions {
    position: absolute;
    top: 16px;
    left: 50%;
    transform: translateX(-50%);
    width: max-content;
    max-width: calc(100% - 32px);
    padding: 9px 15px;
    border: 1px solid #ffffff12;
    border-radius: 100px;
    background: #0c0b0ecc;
    color: #c1b8bd;
    font-size: 12px;
    text-align: center;
    pointer-events: none;
  }

  .footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    padding:
      12px max(18px, env(safe-area-inset-right))
      max(12px, env(safe-area-inset-bottom))
      max(18px, env(safe-area-inset-left));
    background: #0c0b0e;
    border-top: 1px solid #ff294c25;
    flex-shrink: 0;
  }

  #progress { margin: 0; font-size: 13px; color: #c1b8bd; }

  .restart-button {
    padding: 11px 18px;
    border: 1px solid #ff294c60;
    border-radius: 10px;
    background: #ff294c16;
    color: #ff7088;
    font: 600 13px Arial, sans-serif;
    cursor: pointer;
  }

  .restart-button:hover { background: #ff294c30; }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
    border: 0;
  }

  @media (max-width: 640px) {
    body { padding: 32px 16px; }
    .subject-grid {
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }
    .subject-button { border-radius: 12px; }
    .loading-row { gap: 12px; }
    .loading-image { width: clamp(44px, 13vw, 75px); }
    .loading-title { font-size: clamp(1.1rem, 4.7vw, 1.8rem); }
    .instructions { font-size: 11px; }
  }

  @media (prefers-reduced-motion: reduce) {
    main, #loading-screen, .subject-button { transition: none; }
    .loading-image, .loading-fill { animation: none; }
  }
</style>
</head>
<body class="loading">
<div id="loading-screen" role="status" aria-label="Loading">
  <div class="loading-content">
    <div class="loading-row">
      <img class="loading-image"
        src="https://files.catbox.moe/edued0.jpeg"
        alt="" draggable="false">
      <p class="loading-title">Goo Goo Gaga Santa Ԍ​а​ɱ​е​ѕ</p>
      <img class="loading-image"
        src="https://files.catbox.moe/edued0.jpeg"
        alt="" draggable="false">
    </div>
    <div class="loading-track" aria-hidden="true">
      <div class="loading-fill"></div>
    </div>
  </div>
</div>

<main id="main-content" inert aria-hidden="true">
  <div class="accent" aria-hidden="true"></div>
  <h1>Goo Goo Gaga Santa Ԍ​а​ɱ​е​ѕ</h1>
  <div id="subjects" class="subject-grid" aria-label="Subject activities"></div>
</main>

<dialog id="geometry-panel" aria-labelledby="geometry-heading">
  <header class="toolbar">
    <div class="title-group">
      <span class="indicator" aria-hidden="true"></span>
      <h2 id="geometry-heading">Geometry</h2>
    </div>
    <button id="close-geometry" class="close-button"
      type="button" aria-label="Close Geometry">×</button>
  </header>

  <div class="surface-area">
    <canvas id="geometry-surface" width="1280" height="720"
      tabindex="0"
      aria-label="Geometry practice. Hold to move upward, release to move downward."
      aria-describedby="instructions"></canvas>
    <div id="instructions" class="instructions">
      Hold to rise · Release to descend · Space or ↑
    </div>
  </div>

  <footer class="footer">
    <p id="progress">Distance: 0 units</p>
    <button id="restart-geometry" class="restart-button" type="button">
      Begin again
    </button>
  </footer>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
</dialog>

<script>
"use strict";

function ThisWillBeTheNewFunctionWhenThisIComplete() {}

const subjects = document.getElementById("subjects");
const fragment = document.createDocumentFragment();

for (let number = 1; number <= 100; number++) {
  const button = document.createElement("button");
  button.type = "button";
  button.id = `subject-${number}`;
  button.className = "subject-button";
  button.setAttribute(
    "aria-label",
    number === 1 ? "Open Geometry" : `Open subject ${number}`
  );

  if (number === 1) {
    const image = document.createElement("img");
    image.src = "https://files.catbox.moe/q1pmxa.jpeg";
    image.alt = "";
    image.className = "subject-image";
    image.draggable = false;
    button.appendChild(image);
  }

  button.addEventListener(
    "click",
    number === 1 ? Geometry : ThisWillBeTheNewFunctionWhenThisIComplete
  );
  fragment.appendChild(button);
}

subjects.appendChild(fragment);

const panel = document.getElementById("geometry-panel");
const surface = document.getElementById("geometry-surface");
const context = surface.getContext("2d");
const progress = document.getElementById("progress");
const status = document.getElementById("status");
const loadingScreen = document.getElementById("loading-screen");
const mainContent = document.getElementById("main-content");

const W = 1280;
const H = 720;
const boundary = 28;
const speed = 235;
const radius = 11;
const positionX = 210;
const openingHeight = 350;
const courseLength = 7600;

const illustration = new Image();
let illustrationReady = false;
illustration.onload = () => {
  illustrationReady = illustration.naturalWidth > 0;
};
illustration.src = "https://files.catbox.moe/3isihr.png";

function waitForImage(image) {
  return new Promise(resolve => {
    if (image.complete) {
      resolve();
      return;
    }
    image.addEventListener("load", resolve, { once: true });
    image.addEventListener("error", resolve, { once: true });
  });
}

const delay = milliseconds =>
  new Promise(resolve => setTimeout(resolve, milliseconds));

async function revealContent() {
  const images = [
    ...document.querySelectorAll(".loading-image, .subject-image"),
    illustration
  ];

  await Promise.all([
    delay(2200),
    Promise.race([
      Promise.all(images.map(waitForImage)),
      delay(6000)
    ])
  ]);

  document.body.classList.add("ready");
  loadingScreen.classList.add("finished");

  await delay(700);

  loadingScreen.remove();
  mainContent.inert = false;
  mainContent.removeAttribute("aria-hidden");
  document.body.classList.remove("loading");
}

let active = false;
let completed = false;
let distance = 0;
let positionY = H / 2;
let previousTime = 0;
let animation = 0;
let returnFocus = null;
let trace = [];
let gates = [];
let suspended = false;

const keys = new Set();
const pointers = new Set();

function ascending() {
  return keys.size > 0 || pointers.size > 0;
}

function clearInput() {
  keys.clear();
  pointers.clear();
}

function Geometry() {
  if (!panel.open) {
    returnFocus = document.activeElement;
    panel.showModal();
    document.body.classList.add("activity-open");
  }

  resetGeometry();
  surface.focus({ preventScroll: true });

  if (!document.fullscreenElement && panel.requestFullscreen) {
    try {
      const request = panel.requestFullscreen();
      if (request && request.catch) request.catch(() => {});
    } catch (_) {}
  }
}

function resetGeometry() {
  cancelAnimationFrame(animation);
  clearInput();
  active = true;
  completed = false;
  suspended = document.hidden;
  distance = 0;
  positionY = H / 2;
  previousTime = 0;
  trace = [];
  gates = [];

  for (let x = 1400, index = 0; x < courseLength; x += 420, index++) {
    gates.push({
      x,
      width: 72,
      center: H / 2 + Math.sin(index * .8) * 100
    });
  }

  progress.textContent = "Distance: 0 units";
  status.textContent = "Geometry practice started.";
  animation = requestAnimationFrame(frame);
}

function finish(success) {
  active = false;
  completed = success;
  clearInput();
  status.textContent = success
    ? "Geometry practice complete."
    : "Boundary reached. Select Begin again.";
}

function update(seconds) {
  distance += speed * seconds;
  positionY += (ascending() ? -1 : 1) * speed * seconds;

  trace.push({ x: distance + positionX, y: positionY });
  while (trace.length && trace[0].x < distance - 30) trace.shift();

  if (positionY - radius <= boundary ||
      positionY + radius >= H - boundary) {
    finish(false);
    return;
  }

  for (const gate of gates) {
    const x = gate.x - distance;
    if (positionX + radius > x &&
        positionX - radius < x + gate.width) {
      const upper = gate.center - openingHeight / 2;
      const lower = gate.center + openingHeight / 2;
      if (positionY - radius < upper || positionY + radius > lower) {
        finish(false);
        return;
      }
    }
  }

  if (distance >= courseLength) finish(true);
}

function draw() {
  const scale = Math.min(surface.width / W, surface.height / H);
  const offsetX = (surface.width - W * scale) / 2;
  const offsetY = (surface.height - H * scale) / 2;

  context.setTransform(1, 0, 0, 1, 0, 0);
  context.fillStyle = "#070709";
  context.fillRect(0, 0, surface.width, surface.height);
  context.setTransform(scale, 0, 0, scale, offsetX, offsetY);

  context.save();
  context.beginPath();
  context.rect(0, 0, W, H);
  context.clip();

  const background = context.createLinearGradient(0, 0, 0, H);
  background.addColorStop(0, "#140b10");
  background.addColorStop(.5, "#09090d");
  background.addColorStop(1, "#140b10");
  context.fillStyle = background;
  context.fillRect(0, 0, W, H);

  context.strokeStyle = "#ff294c0c";
  context.lineWidth = 1;

  for (let x = -(distance % 70); x < W; x += 70) {
    context.beginPath();
    context.moveTo(x, boundary);
    context.lineTo(x, H - boundary);
    context.stroke();
  }

  for (let y = boundary; y < H; y += 70) {
    context.beginPath();
    context.moveTo(0, y);
    context.lineTo(W, y);
    context.stroke();
  }

  context.fillStyle = "#281018";
  context.fillRect(0, 0, W, boundary);
  context.fillRect(0, H - boundary, W, boundary);

  context.strokeStyle = "#ff294c";
  context.lineWidth = 2;
  context.beginPath();
  context.moveTo(0, boundary);
  context.lineTo(W, boundary);
  context.moveTo(0, H - boundary);
  context.lineTo(W, H - boundary);
  context.stroke();

  for (const gate of gates) {
    const x = gate.x - distance;
    if (x > W || x + gate.width < 0) continue;

    const upper = gate.center - openingHeight / 2;
    const lower = gate.center + openingHeight / 2;
    context.fillStyle = "#43121f";
    context.fillRect(x, boundary, gate.width, upper - boundary);
    context.fillRect(x, lower, gate.width, H - boundary - lower);
    context.strokeStyle = "#ff3658";
    context.lineWidth = 2;
    context.strokeRect(x, boundary, gate.width, upper - boundary);
    context.strokeRect(x, lower, gate.width, H - boundary - lower);
  }

  const finishX = courseLength + positionX - distance;
  if (finishX < W) {
    context.strokeStyle = "#ff9bad";
    context.setLineDash([12, 12]);
    context.beginPath();
    context.moveTo(finishX, boundary);
    context.lineTo(finishX, H - boundary);
    context.stroke();
    context.setLineDash([]);
  }

  if (trace.length) {
    context.beginPath();
    trace.forEach((point, index) => {
      const x = point.x - distance;
      if (index === 0) context.moveTo(x, point.y);
      else context.lineTo(x, point.y);
    });
    context.strokeStyle = "#ff3658";
    context.lineWidth = 5;
    context.lineJoin = "miter";
    context.shadowColor = "#ff294c";
    context.shadowBlur = 16;
    context.stroke();
    context.shadowBlur = 0;
  }

  context.save();
  context.translate(positionX, positionY);
  context.rotate(ascending() ? -Math.PI / 4 : Math.PI / 4);

  if (illustrationReady) {
    const ratio = illustration.naturalWidth / illustration.naturalHeight;
    const width = ratio >= 1 ? 40 : 40 * ratio;
    const height = ratio >= 1 ? 40 / ratio : 40;
    context.drawImage(illustration, -width / 2, -height / 2, width, height);
  } else {
    context.beginPath();
    context.moveTo(19, 0);
    context.lineTo(-14, -12);
    context.lineTo(-7, 0);
    context.lineTo(-14, 12);
    context.closePath();
    context.fillStyle = "#fff4f6";
    context.fill();
    context.strokeStyle = "#ff294c";
    context.lineWidth = 2;
    context.stroke();
  }

  context.restore();

  if (!active || suspended) {
    context.fillStyle = "#070709ba";
    context.fillRect(0, 0, W, H);
    context.textAlign = "center";
    context.fillStyle = "#fff4f6";
    context.font = "bold 42px Arial";
    context.fillText(
      suspended && active
        ? "Practice paused"
        : completed ? "Practice complete" : "Boundary reached",
      W / 2, H / 2 - 12
    );
    context.fillStyle = "#ff8399";
    context.font = "22px Arial";
    context.fillText(
      suspended && active ? "Return to continue" : "Select Begin again",
      W / 2, H / 2 + 34
    );
  }

  context.restore();
  progress.textContent = `Distance: ${Math.floor(distance / 10)} units`;
}

function frame(time) {
  if (!panel.open) return;
  let remaining = previousTime
    ? Math.min((time - previousTime) / 1000, .05)
    : 0;
  previousTime = time;

  while (active && !suspended && remaining > 0) {
    const step = Math.min(remaining, 1 / 120);
    update(step);
    remaining -= step;
  }

  draw();
  if (active) animation = requestAnimationFrame(frame);
}

function resizeSurface() {
  const rectangle = surface.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  surface.width = Math.max(1, Math.round(rectangle.width * ratio));
  surface.height = Math.max(1, Math.round(rectangle.height * ratio));
  if (panel.open) draw();
}

new ResizeObserver(resizeSurface).observe(surface);

surface.addEventListener("pointerdown", event => {
  if (!active || (event.pointerType === "mouse" && event.button !== 0)) return;
  event.preventDefault();
  surface.focus({ preventScroll: true });
  pointers.add(event.pointerId);
  surface.setPointerCapture(event.pointerId);
});

function releasePointer(event) {
  pointers.delete(event.pointerId);
}

surface.addEventListener("pointerup", releasePointer);
surface.addEventListener("pointercancel", releasePointer);
surface.addEventListener("lostpointercapture", releasePointer);

surface.addEventListener("keydown", event => {
  if (event.code === "Space" || event.code === "ArrowUp") {
    event.preventDefault();
    if (active) keys.add(event.code);
  }
});

window.addEventListener("keyup", event => keys.delete(event.code));
surface.addEventListener("blur", clearInput);

window.addEventListener("blur", () => {
  clearInput();
  suspended = true;
  previousTime = 0;
});

window.addEventListener("focus", () => {
  suspended = document.hidden;
  previousTime = 0;
});

document.addEventListener("visibilitychange", () => {
  clearInput();
  suspended = document.hidden;
  previousTime = 0;
});

document.addEventListener("contextmenu", event => event.preventDefault());
document.addEventListener("dragstart", event => event.preventDefault());
document.addEventListener("selectstart", event => event.preventDefault());

document.getElementById("restart-geometry").addEventListener("click", () => {
  resetGeometry();
  surface.focus({ preventScroll: true });
});

async function closeGeometry() {
  active = false;
  clearInput();
  cancelAnimationFrame(animation);

  if (document.fullscreenElement === panel && document.exitFullscreen) {
    try { await document.exitFullscreen(); } catch (_) {}
  }

  if (panel.open) panel.close();
}

document.getElementById("close-geometry")
  .addEventListener("click", closeGeometry);

panel.addEventListener("cancel", event => {
  event.preventDefault();
  closeGeometry();
});

panel.addEventListener("close", () => {
  active = false;
  clearInput();
  cancelAnimationFrame(animation);
  document.body.classList.remove("activity-open");
  if (returnFocus) returnFocus.focus({ preventScroll: true });
});

document.addEventListener("fullscreenchange", () => {
  previousTime = 0;
  clearInput();
  if (panel.open) resizeSurface();
});

revealContent();
</script>
</body>
</html>
